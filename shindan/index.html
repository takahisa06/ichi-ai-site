<style>

  :root {

    --ink50: rgba(22,20,15,.5);

    --vio: #8F7DD8;

    --gold: #D8A25C;

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.8;
    min-height: 100vh;
  }
  /* 朝の光(固定背景) */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(90vmax 90vmax at 85% -12%, rgba(238,168,200,.4), rgba(190,175,232,.26) 44%, rgba(160,212,190,.14) 66%, transparent 78%),

  #app { max-width: 560px; margin: 0 auto; padding: 20px 20px 56px; }

  /* progress */
  #progress-wrap { padding: 10px 0 22px; }
  #progress-bar { height: 3px; background: var(--hair); border-radius: 2px; overflow: hidden; }

  .prompt-copy {

  .prompt-copy:active { background: var(--ink); color: var(--paper); }
  .yohaku {

  .cta-card {

    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  .cta-title { font-family: var(--f-min); font-size: 19px; font-weight: 600; margin-bottom: 12px; line-height: 1.6; text-wrap: balance; }
  .cta-body { font-size: 14px; text-align: left; color: var(--ink70); }
  .cta-note { font-size: 12px; color: var(--ink50); margin-top: 12px; }

  .retry { text-align: center; margin-top: 22px; }

  .privacy { font-size: 11px; color: var(--ink50); text-align: center; margin-top: 26px; line-height: 1.9; }

  /* ===== 結果画面 v2: キャラ×レーダー×見やすいCTA ===== */
  .nick {
    display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: .05em;
    background: linear-gradient(100deg, rgba(240,183,206,.35), rgba(201,184,245,.35));
    border: 1px solid rgba(255,255,255,.9); border-radius: 999px;

  .char { width: 128px; height: 128px; margin: 2px auto 4px; display: block;

  .type-desc { font-size: 14px; }
  .share-btn {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;

  .radar-wrap { display: flex; justify-content: center; }
  .radar-wrap svg { width: 100%; max-width: 330px; height: auto; }
  .num-row2 { display: flex; gap: 12px; margin: 6px 0 10px; }
  .num-box2 { flex: 1; text-align: center; background: rgba(247,245,239,.75);

/* ============================================================
   判定ロジック（design.md §8）— 純関数・テスト対象
   hours: { 項目index: 時間 } ／ releaseKey: A|B|C ／ q7Key: D1-3 ／ aiKey: E0-3
   ============================================================ */
function computeResult(hours, releaseKey, q7Key, aiKey) {
  const cats = ["research", "content", "admin"];
  const priority = ["content", "research", "admin"];
  const catHours = { research: 0, content: 0, admin: 0 };
  let weekly = 0, easeRaw = 0;
  const rows = [];
  Object.keys(hours || {}).forEach(k => {
    const i = Number(k); const h = Number(hours[k]);
    const item = DATA.checklist[i];
    if (!item || !(h > 0)) return;
    catHours[item.cat] += h; weekly += h; easeRaw += h * item.ease;
    rows.push({ i, label: item.label, hours: h, ai: item.ai, work: item.work });
  });
  rows.sort((a, b) => b.hours - a.hours || a.i - b.i);

  const maxH = Math.max(...cats.map(c => catHours[c]));
  let tied = cats.filter(c => catHours[c] === maxH);
  const rel = DATA.release.options.find(o => o.key === releaseKey);
  let type;
  if (tied.length === 1) type = tied[0];
  else if (rel && tied.includes(rel.cat)) type = rel.cat;
  else type = priority.find(c => tied.includes(c));

  const candidates = [];
  rows.forEach(r => { if (candidates.length < 2 && !candidates.includes(r.ai)) candidates.push(r.ai); });
  DATA.types[type].defaults.forEach(a => { if (candidates.length < 2 && !candidates.includes(a)) candidates.push(a); });

  const q7 = DATA.q7.options.find(o => o.key === q7Key) || DATA.q7.options[1];
  const weeklyR = Math.round(weekly * 10) / 10;
  const topItem = rows.length ? rows[0].label : null;
  const idealLine = rows.length
    ? "週" + weeklyR + "時間を「" + topItem + "」に取られてて、それが半分になれば、" + q7.phrase + "に回せる。"
    : DATA.quietWeek;

  return {
    type, weekly: weeklyR, yearly: Math.round(weekly * 50),
    easeHours: Math.round(easeRaw * 2) / 2,
    catHours, topItem, topWork: rows.length ? rows[0].work : null,
    top3: rows.slice(0, 3).map(r => ({ label: r.label, hours: r.hours })),
    candidates, idealLine,
    releaseKey: rel ? rel.key : null, q7Key: q7.key, aiKey: aiKey || null
  };
}

/* 6軸レーダー（見える化用）: 申告時間だけで作る */
function computeAxes(hours) {
  const h = i => Number((hours || {})[i]) || 0;
  const raw = [
    h(0) + h(1),          /* ネタ探し */
    h(2) + h(3) + h(7),   /* 文章 */
    h(4),                 /* 画像・動画 */
    h(5) + h(6),          /* 返信・対応 */
    h(8) + h(9) + h(10),  /* 事務・お金 */
    h(11)                 /* 学び・情報 */
  ];
  const mx = Math.max(...raw, 1);
  return raw.map(v => Math.max(14, Math.round(v / (mx * 1.12) * 100)));
}

function easeLabel(r) { return r.easeHours < 0.5 ? "週30分" : "週" + r.easeHours + "時間"; }

/* 申込フォームの事前入力URL（design.md §10）。ボタンを押したときだけ開く */
function buildFormUrl(r) {
  const t = DATA.types[r.type];
  const rel = DATA.release.options.find(o => o.key === r.releaseKey);
  const q7 = DATA.q7.options.find(o => o.key === r.q7Key);
  const ai = DATA.aiExp.options.find(o => o.key === r.aiKey);
  const lines = ["【AI社員タイプ診断の結果】", "タイプ: " + t.name];
  if (r.weekly > 0) {
    lines.push("先週の時間: 週" + r.weekly + "時間（年 約" + r.yearly + "時間）");
    lines.push("上位: " + r.top3.map(x => x.label + " " + x.hours + "h").join(" ／ "));
  } else {
    lines.push("先週の時間: チェックなし");
  }
  if (rel) lines.push("やめられない理由: " + rel.label);
  if (ai) lines.push("AI経験: " + ai.label);
  if (q7) lines.push("余白: " + q7.label);
  let url = DATA.form.base + "?usp=pp_url&" + DATA.form.entryNote + "=" + encodeURIComponent(lines.join("\n"));
  if (r.topWork) url += "&" + DATA.form.entryWork + "=" + encodeURIComponent(r.topWork);
  return url;
}

/* ============================================================
   画面制御
   steps: 0 start / 1 棚卸し① / 2 棚卸し②(時間) / 3 手放せなさ / 4 余白 / 5 AI経験 / 6 結果
   ============================================================ */
const TOTAL_STEPS = 6;
const state = { step: 0, checked: new Set(), hours: {}, releaseKey: null, q7Key: null, aiKey: null };

const screenEl = document.getElementById("screen");
const progWrap = document.getElementById("progress-wrap");
const progFill = document.getElementById("progress-fill");
const progLabel = document.getElementById("progress-label");

const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>';

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function checkedHours() {
  const h = {};
  state.checked.forEach(i => { if (state.hours[i]) h[i] = state.hours[i]; });
  return h;
}

function topItemLabel() {
  const h = checkedHours();
  let best = null;
  Object.keys(h).map(Number).sort((a, b) => a - b).forEach(i => { if (best === null || h[i] > h[best]) best = i; });
  return best === null ? null : DATA.checklist[best].label;
}

function updateProgress() {
  if (state.step === 0) { progWrap.hidden = true; return; }
  progWrap.hidden = false;
  const pct = Math.min(100, Math.round(state.step / TOTAL_STEPS * 100));
  progFill.style.width = pct + "%";
  progLabel.textContent = state.step <= 5 ? "ステップ " + state.step + " / 5" : "診断結果";
}

function render() {
  updateProgress();
  if (state.step === 0) renderStart();
  else if (state.step === 1) renderChecklist();
  else if (state.step === 2) renderHours();
  else if (state.step === 3) renderRelease();
  else if (state.step === 4) renderQ7();
  else if (state.step === 5) renderAiExp();
  else renderResult();
  window.scrollTo({ top: 0 });
}

function renderStart() {
  screenEl.innerHTML =
    '<div class="screen start-glow" style="padding-top:44px">' +
      '<div class="start-ey">PERSONAL AI TEAM — DIAGNOSIS</div>' +
      '<span class="start-badge">3分・全部タップだけ</span>' +
      '<h1><span class="hg">AI社員</span>タイプ診断</h1>' +
      '<p class="start-sub">1週間の仕事をタップで棚卸し。時間がどこに消えてるかと、最初にAIに任せる仕事の候補が3分で出ます。</p>' +
      '<p class="start-note">無料・登録なしで、最後まで診断できます。</p>' +
      '<button class="btn" id="start-btn">棚卸しをはじめる</button>' +
      '<p class="byline">いチ（@ichi_ai_lab）｜AI活用で自分時間を1日+3時間</p>' +
    '</div>';
  document.getElementById("start-btn").onclick = () => { state.step = 1; render(); };
}

function optionButtons(options) {
  return options.map((o, i) =>
    '<button class="option" data-i="' + i + '">' + esc(o.label) + '</button>'
  ).join("");
}

function bindOptions(onPick, onBack) {
  screenEl.querySelectorAll(".option").forEach(btn => {
    btn.onclick = () => {
      btn.classList.add("selected");
      setTimeout(() => onPick(Number(btn.dataset.i)), 220);
    };
  });
  const back = screenEl.querySelector(".btn-back");
  if (back) back.onclick = onBack;
}

function renderChecklist() {
  const items = DATA.checklist.map((c, i) =>
    '<div class="check-item' + (state.checked.has(i) ? " checked" : "") + '" data-i="' + i + '">' +
      '<span class="check-box">' + CHECK_SVG + '</span>' +
      '<span>' + esc(c.label) + '</span>' +
    '</div>'
  ).join("");
  screenEl.innerHTML =
    '<div class="screen">' +
      '<div class="q-number">棚卸し 1</div>' +
      '<div class="q-text">先週やった仕事、当てはまるもの全部にチェック</div>' +
      '<p class="check-intro">時間の合計は次の画面で出します。当てはまるものが無ければ、そのまま次へ。</p>' +
      items +
      '<div id="live-total"><span class="lt-label">いまのチェック</span><span class="lt-value" id="lt-value">0 個</span></div>' +
      '<button class="btn" id="to-next">次へ</button>' +
    '</div>';

  function refreshTotal() {
    document.getElementById("lt-value").textContent = state.checked.size + " 個";
  }
  refreshTotal();
  screenEl.querySelectorAll(".check-item").forEach(el => {
    el.onclick = () => {
      const i = Number(el.dataset.i);
      if (state.checked.has(i)) { state.checked.delete(i); delete state.hours[i]; el.classList.remove("checked"); }
      else { state.checked.add(i); el.classList.add("checked"); }
      refreshTotal();
    };
  });
  document.getElementById("to-next").onclick = () => {
    state.step = state.checked.size > 0 ? 2 : 3;
    render();
  };
}

function renderHours() {
  const idx = [...state.checked].sort((a, b) => a - b);
  const rows = idx.map(i =>
    '<div class="hours-row" data-i="' + i + '">' +
      '<div class="hours-label">' + esc(DATA.checklist[i].label) + '</div>' +
      '<div class="seg">' + DATA.hoursOptions.map((o, k) =>
        '<button data-k="' + k + '"' + (state.hours[i] === o.h ? ' class="on"' : '') + '>' + esc(o.label) + '</button>'
      ).join("") + '</div>' +
    '</div>'
  ).join("");
  screenEl.innerHTML =
    '<div class="screen">' +
      '<div class="q-number">棚卸し 2</div>' +
      '<div class="q-text">先週、それぞれどのくらいでしたか</div>' +
      '<p class="check-intro">ざっくりで大丈夫です。合計はこの場で出します。</p>' +
      rows +
      '<div id="live-total"><span class="lt-label" id="lt-label">あと 0 つ</span><span class="lt-value" id="lt-value">週 0時間</span></div>' +
      '<button class="btn" id="to-next" disabled>次へ</button>' +
      '<button class="btn-back">ひとつ前に戻る</button>' +
    '</div>';

  function refresh() {
    let t = 0, left = 0;
    idx.forEach(i => { if (state.hours[i]) t += state.hours[i]; else left += 1; });
    document.getElementById("lt-value").textContent = "週 " + (Math.round(t * 10) / 10) + "時間";
    document.getElementById("lt-label").textContent = left > 0 ? "あと " + left + " つ" : "全部えらべました";
    document.getElementById("to-next").disabled = left > 0;
  }
  refresh();
  screenEl.querySelectorAll(".hours-row").forEach(row => {
    const i = Number(row.dataset.i);
    row.querySelectorAll("button").forEach(b => {
      b.onclick = () => {
        state.hours[i] = DATA.hoursOptions[Number(b.dataset.k)].h;
        row.querySelectorAll("button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        refresh();
      };
    });
  });
  document.getElementById("to-next").onclick = () => { state.step = 3; render(); };
  screenEl.querySelector(".btn-back").onclick = () => { state.step = 1; render(); };
}

function renderRelease() {
  const item = topItemLabel();
  const text = item ? DATA.release.text.replace("{item}", item) : DATA.release.textNoItem;
  screenEl.innerHTML =
    '<div class="screen">' +
      '<div class="q-number">Q1</div>' +
      '<div class="q-text">' + esc(text) + '</div>' +
      optionButtons(DATA.release.options) +
      '<button class="btn-back">ひとつ前に戻る</button>' +
    '</div>';
  bindOptions(i => { state.releaseKey = DATA.release.options[i].key; state.step = 4; render(); },
    () => { state.step = state.checked.size > 0 ? 2 : 1; render(); });
}

function renderQ7() {
  screenEl.innerHTML =
    '<div class="screen">' +
      '<div class="q-number">Q2</div>' +
      '<div class="q-text">' + esc(DATA.q7.text) + '</div>' +
      optionButtons(DATA.q7.options) +
      '<button class="btn-back">ひとつ前に戻る</button>' +
    '</div>';
  bindOptions(i => { state.q7Key = DATA.q7.options[i].key; state.step = 5; render(); },
    () => { state.step = 3; render(); });
}

function renderAiExp() {
  screenEl.innerHTML =
    '<div class="screen">' +
      '<div class="q-number">Q3</div>' +
      '<div class="q-text">' + esc(DATA.aiExp.text) + '</div>' +
      optionButtons(DATA.aiExp.options) +
      '<button class="btn-back">ひとつ前に戻る</button>' +
    '</div>';
  bindOptions(i => { state.aiKey = DATA.aiExp.options[i].key; state.step = 6; render(); },
    () => { state.step = 4; render(); });
}

function radarSVG(vals) {
  const cx = 165, cy = 128, r = 86, n = 6;
  const LBL = ["ネタ探し", "文章", "画像・動画", "返信・対応", "事務・お金", "学び・情報"];
  const pt = (i, rr) => {
    const a = -Math.PI / 2 + i * Math.PI * 2 / n;
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  };
  let grid = "";
  [0.33, 0.66, 1].forEach(k => {
    const ps = Array.from({ length: n }, (_, i) => pt(i, r * k).map(v => v.toFixed(1)).join(",")).join(" ");
    grid += '<polygon points="' + ps + '" fill="none" stroke="rgba(22,20,15,.1)" stroke-width="1"/>';
  });
  let axes = "";
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, r);
    axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="rgba(22,20,15,.08)"/>';
  }
  const poly = vals.map((v, i) => pt(i, r * v / 100).map(x => x.toFixed(1)).join(",")).join(" ");
  let dots = "", labels = "";
  const LC = ["#B95F84", "#6C55BE", "#8F7DD8", "#3E8266", "#4E9E7E", "#C08A3E"];
  vals.forEach((v, i) => {
    const [x, y] = pt(i, r * v / 100);
    dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.2" fill="' + LC[i] + '"/>';
    const [lx, ly] = pt(i, r + 20);
    labels += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="middle" font-size="11" fill="rgba(22,20,15,.62)" font-weight="600">' + LBL[i] + '</text>';
  });
  return '<svg viewBox="0 0 330 262">'
    + '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#D4849F"/><stop offset=".5" stop-color="#8F7DD8"/><stop offset="1" stop-color="#4E9E7E"/>'
    + '</linearGradient></defs>'
    + grid + axes
    + '<polygon points="' + poly + '" fill="url(#rg)" fill-opacity=".3" stroke="url(#rg)" stroke-width="2.2" stroke-linejoin="round"/>'
    + dots + labels + '</svg>';
}

function renderResult() {
  const hours = checkedHours();
  const r = computeResult(hours, state.releaseKey, state.q7Key, state.aiKey);
  const t = DATA.types[r.type];
  const axes = computeAxes(hours);
  const formUrl = buildFormUrl(r);

  const numBlock = r.weekly > 0

  const cands = r.candidates.map((key, n) => {

  screenEl.innerHTML =

      '<div class="stat-card">' +

        CHARS[r.type] +

        '<div class="type-name">' + esc(t.name) + '</div>' +
        '<p class="type-desc">' + esc(t.desc) + '</p>' +
        '<button class="share-btn" id="share-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><line x1="12" y1="2" x2="12" y2="15"/></svg>この結果をシェアする</button>' +
      '</div>' +
      '<div class="yohaku">' + esc(r.idealLine) + '</div>' +
      '<div class="section-card">' +
        '<div class="sc-label">最初に手放す候補</div>' +
        cands +
        '<p class="cand-close">' + esc(DATA.candClose) + '</p>' +
      '</div>' +
      '<div class="cta-card">' +
        '<div class="cta-title">' + esc(DATA.cta.title) + '</div>' +
        '<p class="cta-body">' + esc(DATA.cta.body) + '</p>' +
        '<div class="promise-title">' + esc(DATA.cta.promiseTitle) + '</div>' +
        '<ul class="promise">' + DATA.cta.promise.map((p, n) => '<li data-n="' + (n + 1) + '">' + esc(p) + '</li>').join("") + '</ul>' +
        '<p class="cta-line">' + esc(DATA.cta.line) + '</p>' +
        '<a class="btn btn-cta" id="cta-btn" href="' + esc(formUrl) + '" target="_blank" rel="noopener">' + esc(DATA.cta.button) + '</a>' +
        '<p class="cta-note">' + esc(DATA.cta.note) + '</p>' +
      '</div>' +
      '<div class="retry"><button id="retry-btn">もう一度診断する</button></div>' +
      '<p class="privacy">' + esc(DATA.privacy) + '</p>' +
      '<a class="sticky-cta" id="sticky-btn" href="' + esc(formUrl) + '" target="_blank" rel="noopener">' + esc(DATA.cta.sticky) + '</a>' +
    '</div>';

  document.getElementById("share-btn").onclick = function () {
    const text = '私のAI社員タイプ診断は「' + t.name + '」（' + NICKS[r.type] + '）でした。' +
      (r.weekly > 0 ? '先週は週' + r.weekly + '時間が、発信と裏方の仕事に使われていました。' : '') +
      '\n自分の時間がどこに消えているか3分でわかる無料診断はこちら';
    const url = location.href;
    if (navigator.share) {
      navigator.share({ title: "AI社員タイプ診断", text: text, url: url }).catch(() => {});
    } else {
      const done = () => { this.textContent = "コピーしました。SNSに貼ってシェアできます"; };
      if (navigator.clipboard) navigator.clipboard.writeText(text + "\n" + url).then(done.bind(this));
    }
  };
  const copyBtn = document.getElementById("copy-btn");
  if (copyBtn) copyBtn.onclick = function () {
    const txt = DATA.staff[r.candidates[0]].prompt;
    const done = () => { this.textContent = "コピーしました"; setTimeout(() => { this.textContent = "この文をコピーする"; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done.bind(this));
    } else {
      const ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      done.call(this);
    }
  };
  document.getElementById("retry-btn").onclick = () => {
    state.step = 0; state.checked = new Set(); state.hours = {}; state.releaseKey = null; state.q7Key = null; state.aiKey = null;
    render();
  };
}
