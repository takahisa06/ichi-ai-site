<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><!-- 正式公開時に外す -->
<title>AI社員タイプ診断｜あなたの1週間、どこに時間が消えてる？ 3分の棚卸し</title>
<meta name="description" content="先週の仕事をタップで棚卸し。時間がどこに消えているかと、最初にAIに任せる仕事の候補が3分でわかります。無料・登録なし。">
<meta property="og:title" content="AI社員タイプ診断">
<meta property="og:description" content="あなたの1週間、どこに時間が消えてる？ 3分の棚卸し。無料・登録なし。">
<meta property="og:type" content="website">
<style>
  /* ==========================================================
     AI社員タイプ診断 — 「余白の朝」デザイン
     本サイト(ichi AI)と同じ世界観: 紙白×淡いオーロラ×明朝
  ========================================================== */
  :root {
    --paper: #F7F5EF;
    --ink: #16140F;
    --ink70: rgba(22,20,15,.72);
    --ink50: rgba(22,20,15,.5);
    --ink30: rgba(22,20,15,.32);
    --hair: rgba(22,20,15,.13);
    --card: rgba(255,255,255,.72);
    --rose: #D4849F;
    --vio: #8F7DD8;
    --mint: #4E9E7E;
    --gold: #D8A25C;
    --line: #06c755;
    --grad: linear-gradient(100deg, #C0708F, #7E68C4 45%, #4F8F72);
    --gradbar: linear-gradient(90deg, #D4849F, #8F7DD8 45%, #D8A25C);
    --radius: 20px;
    --f-min: "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.8;
    min-height: 100vh;
  }
  /* 朝の光(固定背景) */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(90vmax 90vmax at 85% -12%, rgba(238,168,200,.4), rgba(190,175,232,.26) 44%, rgba(160,212,190,.14) 66%, transparent 78%),
      radial-gradient(70vmax 70vmax at -10% 108%, rgba(255,214,150,.22), transparent 60%),
      linear-gradient(180deg, #FBF9F4, var(--paper));
  }
  #app { max-width: 560px; margin: 0 auto; padding: 20px 20px 56px; }

  /* progress */
  #progress-wrap { padding: 10px 0 22px; }
  #progress-bar { height: 3px; background: var(--hair); border-radius: 2px; overflow: hidden; }
  #progress-fill { height: 100%; width: 0%; background: var(--gradbar); border-radius: 2px; transition: width .5s var(--ease); }
  #progress-label { font-size: 10.5px; letter-spacing: .22em; color: var(--ink50); margin-top: 8px; text-align: right; }

  .screen { animation: fadein .55s var(--ease); }
  @keyframes fadein { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

  /* start */
  .start-glow { position: relative; }
  .start-glow::before {
    content: ""; position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    width: 260px; height: 260px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,.9), rgba(242,186,208,.35) 40%, rgba(201,184,245,.25) 62%, transparent 75%);
    filter: blur(2px);
  }
  .start-ey { position: relative; font-size: 10px; letter-spacing: .38em; color: var(--ink50); margin-bottom: 18px; }
  .start-badge {
    position: relative; display: inline-block; background: rgba(255,255,255,.7);
    border: 1px solid var(--hair); color: var(--ink70);
    font-size: 12px; font-weight: 600; letter-spacing: .06em;
    padding: 6px 16px; border-radius: 999px; margin-bottom: 20px; backdrop-filter: blur(6px);
  }
  h1 {
    position: relative; font-family: var(--f-min); font-weight: 600;
    font-size: 34px; line-height: 1.42; letter-spacing: .01em; margin-bottom: 14px; text-wrap: balance;
  }
  h1 .hg { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .start-sub { position: relative; font-size: 15.5px; margin-bottom: 8px; color: var(--ink70); }
  .start-note { position: relative; font-size: 13px; color: var(--ink50); margin-bottom: 30px; }
  .byline { font-size: 12px; letter-spacing: .04em; color: var(--ink50); margin-top: 30px; }

  /* question */
  .q-number { font-size: 11px; font-weight: 600; letter-spacing: .3em; color: var(--vio); margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; }
  .q-number::after { content: ""; width: 44px; height: 1px; background: var(--ink30); }
  .q-text { font-family: var(--f-min); font-size: 21px; font-weight: 600; line-height: 1.6; margin-bottom: 26px; text-wrap: balance; }
  .option {
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius);
    padding: 17px 20px; margin-bottom: 12px; font-size: 14.5px; line-height: 1.7;
    cursor: pointer; transition: border-color .25s, background .25s, transform .35s var(--ease), box-shadow .35s;
    font-family: inherit; color: inherit; backdrop-filter: blur(8px);
  }
  .option:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -22px rgba(90,70,140,.4); }
  .option:active, .option.selected {
    border-color: rgba(143,125,216,.7); background: rgba(201,184,245,.16);
    box-shadow: 0 14px 34px -22px rgba(90,70,140,.5);
  }

  /* checklist */
  .check-intro { font-size: 14px; color: var(--ink70); margin-bottom: 20px; }
  .check-item {
    display: flex; align-items: center; gap: 13px;
    background: var(--card); border: 1px solid var(--hair); border-radius: 16px;
    padding: 13px 16px; margin-bottom: 10px; font-size: 14px; line-height: 1.6;
    cursor: pointer; transition: border-color .25s, background .25s; backdrop-filter: blur(8px);
  }
  .check-item.checked { border-color: rgba(143,125,216,.7); background: rgba(201,184,245,.16); }
  .check-box {
    flex: 0 0 22px; width: 22px; height: 22px; border: 1.5px solid var(--ink30); border-radius: 7px;
    display: flex; align-items: center; justify-content: center; background: #fff; transition: background .25s, border-color .25s;
  }
  .check-item.checked .check-box { background: var(--vio); border-color: var(--vio); }
  .check-box svg { display: none; }
  .check-item.checked .check-box svg { display: block; }
  #live-total {
    position: sticky; bottom: 12px; background: rgba(22,20,15,.92); color: #F7F5EF;
    border-radius: 999px; padding: 14px 22px; margin-top: 20px; backdrop-filter: blur(10px);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    box-shadow: 0 18px 44px -18px rgba(22,20,15,.5);
  }
  #live-total .lt-label { font-size: 12px; letter-spacing: .06em; opacity: .8; }
  #live-total .lt-value { font-size: 17px; font-weight: 700; white-space: nowrap;
    background: linear-gradient(90deg,#F0B7CE,#C9B8F5 55%,#FFDF9E);
    -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* buttons */
  .btn {
    display: block; width: 100%; text-align: center; position: relative; overflow: hidden;
    text-decoration: none;
    background: var(--ink); color: var(--paper); border: none; border-radius: 999px;
    padding: 17px; font-size: 15.5px; font-weight: 700; letter-spacing: .08em; cursor: pointer;
    font-family: inherit; margin-top: 22px; transition: transform .35s var(--ease), box-shadow .35s, opacity .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -18px rgba(22,20,15,.5); }
  .btn:active { opacity: .88; }
  .btn-line { background: var(--line); color: #fff; }
  .btn-back {
    background: none; border: none; color: var(--ink50); font-size: 13px; letter-spacing: .04em;
    cursor: pointer; font-family: inherit; margin-top: 16px; padding: 8px;
    display: block; margin-left: auto; margin-right: auto;
  }

  /* result */
  .result-eyebrow { font-size: 10.5px; letter-spacing: .32em; color: var(--ink50); margin-bottom: 10px; }
  .type-card {
    position: relative; background: var(--card); border-radius: 26px; padding: 32px 24px 28px;
    text-align: center; margin-bottom: 18px; border: 1px solid rgba(255,255,255,.8);
    backdrop-filter: blur(14px); box-shadow: 0 30px 70px -40px rgba(90,70,140,.45); overflow: hidden;
  }
  .type-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradbar); }
  .type-icon {
    width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .ti-research { color: #6C55BE; background: rgba(143,125,216,.14); }
  .ti-content  { color: #B95F84; background: rgba(212,132,159,.15); }
  .ti-admin    { color: #3E8266; background: rgba(94,158,130,.15); }
  .type-name { font-family: var(--f-min); font-size: 27px; font-weight: 600; line-height: 1.4;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .type-desc { font-size: 14.5px; text-align: left; margin-top: 18px; color: var(--ink70); }

  .num-card {
    background: #16140F; color: #F7F5EF; border-radius: 26px;
    padding: 26px 24px; margin-bottom: 18px; position: relative; overflow: hidden;
  }
  .num-card::after { content: ""; position: absolute; right: -46px; top: -46px; width: 150px; height: 150px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,214,150,.28), transparent 70%); }
  .num-card .nc-title { font-size: 12px; letter-spacing: .1em; opacity: .75; margin-bottom: 12px; }
  .num-row { display: flex; gap: 16px; margin-bottom: 14px; }
  .num-box { flex: 1; text-align: center; }
  .num-big { font-family: var(--f-min); font-size: 38px; font-weight: 600; line-height: 1.2;
    background: linear-gradient(90deg,#F0B7CE,#C9B8F5 55%,#FFDF9E);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .num-unit { font-size: 12px; opacity: .75; letter-spacing: .06em; }
  .num-note { font-size: 13px; opacity: .9; line-height: 1.9; position: relative; }

  .section-card {
    background: var(--card); border: 1px solid rgba(255,255,255,.8); border-radius: 26px;
    padding: 24px 22px; margin-bottom: 18px; backdrop-filter: blur(10px);
  }
  .sc-label { font-size: 10.5px; font-weight: 700; letter-spacing: .26em; color: var(--vio); margin-bottom: 10px; }
  .sc-title { font-family: var(--f-min); font-size: 20px; font-weight: 600; margin-bottom: 10px; }
  .sc-body { font-size: 14px; color: var(--ink70); }
  .prompt-box {
    background: rgba(247,245,239,.9); border: 1px dashed var(--ink30); border-radius: 14px;
    padding: 16px; margin-top: 14px; font-size: 13.5px; line-height: 1.8;
  }
  .prompt-copy {
    background: none; border: 1px solid var(--ink); color: var(--ink);
    border-radius: 999px; padding: 8px 20px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em;
    cursor: pointer; font-family: inherit; margin-top: 14px; transition: background .25s, color .25s;
  }
  .prompt-copy:active { background: var(--ink); color: var(--paper); }
  .yohaku {
    font-size: 14px; color: var(--ink); border-radius: 16px; padding: 16px 20px; margin-bottom: 24px;
    background: linear-gradient(100deg, rgba(240,183,206,.22), rgba(201,184,245,.22) 50%, rgba(255,223,158,.24));
    border: 1px solid rgba(255,255,255,.8);
  }

  .cta-card {
    position: relative; background: rgba(255,255,255,.8); border-radius: 26px;
    padding: 30px 24px; text-align: center; margin-bottom: 12px; overflow: hidden;
    backdrop-filter: blur(12px); box-shadow: 0 30px 70px -40px rgba(90,70,140,.45);
  }
  .cta-card::before { content: ""; position: absolute; inset: 0; border-radius: 26px; padding: 1.5px;
    background: var(--gradbar);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  .cta-title { font-family: var(--f-min); font-size: 19px; font-weight: 600; margin-bottom: 12px; line-height: 1.6; text-wrap: balance; }
  .cta-body { font-size: 14px; text-align: left; color: var(--ink70); }
  .cta-note { font-size: 12px; color: var(--ink50); margin-top: 12px; }

  .retry { text-align: center; margin-top: 22px; }
  .retry button { background: none; border: none; color: var(--ink50); font-size: 13px;
    text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-family: inherit; padding: 8px; }
  .privacy { font-size: 11px; color: var(--ink50); text-align: center; margin-top: 26px; line-height: 1.9; }

  /* ===== 結果画面 v2: キャラ×レーダー×見やすいCTA ===== */
  .nick {
    display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: .05em;
    background: linear-gradient(100deg, rgba(240,183,206,.35), rgba(201,184,245,.35));
    border: 1px solid rgba(255,255,255,.9); border-radius: 999px;
    padding: 6px 16px; margin: 12px 0 6px; color: var(--ink);
  }
  .char { width: 128px; height: 128px; margin: 2px auto 4px; display: block;
    filter: drop-shadow(0 10px 18px rgba(90,70,140,.18)); }
  .type-desc { font-size: 14px; }
  .share-btn {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
    background: none; border: 1px solid var(--ink30); color: var(--ink70);
    border-radius: 999px; padding: 9px 20px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: border-color .25s, color .25s;
  }
  .share-btn:active { border-color: var(--vio); color: var(--vio); }
  /* 統計カード(旧・黒カードの置き換え) */
  .stat-card {
    background: var(--card); border: 1px solid rgba(255,255,255,.85); border-radius: 26px;
    padding: 22px 20px 20px; margin-bottom: 18px; backdrop-filter: blur(12px);
    box-shadow: 0 26px 60px -38px rgba(90,70,140,.4);
  }
  .stat-card .nc-title { font-size: 11px; letter-spacing: .2em; color: var(--ink50); margin-bottom: 4px; text-align: center; }
  .radar-wrap { display: flex; justify-content: center; }
  .radar-wrap svg { width: 100%; max-width: 330px; height: auto; }
  .num-row2 { display: flex; gap: 12px; margin: 6px 0 10px; }
  .num-box2 { flex: 1; text-align: center; background: rgba(247,245,239,.75);
    border: 1px solid var(--hair); border-radius: 16px; padding: 12px 8px; }
  .num-big2 { font-family: var(--f-min); font-size: 30px; font-weight: 600; line-height: 1.25;
    background: linear-gradient(95deg, #B95F84, #6C55BE 55%, #3E8266);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .num-unit2 { font-size: 11px; letter-spacing: .08em; color: var(--ink50); }
  .num-note2 { font-size: 12.5px; line-height: 1.9; color: var(--ink70); }
  .num-note2 b { color: var(--ink); }
  /* CTA 3ステップ */
  .steps3 { display: flex; align-items: stretch; gap: 6px; margin: 16px 0 6px; }
  .step3 { flex: 1; background: rgba(247,245,239,.8); border: 1px solid var(--hair);
    border-radius: 14px; padding: 12px 6px 10px; text-align: center; position: relative; }
  .step3 .sn2 { width: 22px; height: 22px; border-radius: 50%; margin: 0 auto 7px;
    background: var(--ink); color: var(--paper); font-size: 11.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .step3 p { font-size: 11px; line-height: 1.55; color: var(--ink70); }
  .step3 p b { display: block; font-size: 12px; color: var(--ink); margin-bottom: 2px; }
  .step3:not(:last-child)::after { content: "→"; position: absolute; right: -9px; top: 50%;
    transform: translateY(-50%); color: var(--ink30); font-size: 12px; z-index: 2; }
  /* 固定LINEバー(結果画面のみ) */
  .sticky-cta {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 50;
    width: min(520px, calc(100% - 32px));
    display: block; text-align: center; text-decoration: none;
    background: var(--line); color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .05em;
    border-radius: 999px; padding: 16px;
    box-shadow: 0 18px 44px -14px rgba(6,199,85,.55);
    animation: ctain .6s var(--ease) .4s both;
  }
  @keyframes ctain { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .result-pad { padding-bottom: 84px; }

  /* ===== v2 (2026-10-17): 棚卸し②（時間）・候補カード・設計セッションCTA ===== */
  .hours-row { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; backdrop-filter: blur(8px); }
  .hours-label { font-size: 13.5px; line-height: 1.6; margin-bottom: 8px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; background: #fff; border: 1px solid var(--hair); border-radius: 999px; padding: 9px 4px; font-size: 12px; font-weight: 600; color: var(--ink70); cursor: pointer; font-family: inherit; transition: background .2s, border-color .2s, color .2s; }
  .seg button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn[disabled] { opacity: .35; cursor: default; transform: none; box-shadow: none; }
  .top3 { list-style: none; margin: 4px 0 0; }
  .top3 li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 7px 0; border-top: 1px solid var(--hair); line-height: 1.6; }
  .top3 li span:last-child { white-space: nowrap; font-weight: 700; }
  .ease-note { font-size: 13px; color: var(--ink70); line-height: 1.9; margin-top: 12px; }
  .ease-big { font-family: var(--f-min); font-size: 24px; font-weight: 600; color: var(--ink); margin: 0 2px; }
  .cand { background: rgba(247,245,239,.8); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 16px; margin-top: 12px; }
  .cand-no { font-size: 10.5px; letter-spacing: .24em; color: var(--vio); font-weight: 700; margin-bottom: 4px; }
  .cand-name { font-family: var(--f-min); font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .cand-change { font-size: 13.5px; color: var(--ink70); }
  .cand-close { font-size: 13px; color: var(--ink); margin-top: 14px; }
  .promise-title { font-size: 11px; letter-spacing: .2em; color: var(--ink50); margin-top: 18px; text-align: left; }
  .promise { list-style: none; text-align: left; margin: 10px 0 0; }
  .promise li { position: relative; padding-left: 28px; font-size: 13.5px; color: var(--ink); margin-bottom: 8px; line-height: 1.7; }
  .promise li::before { content: attr(data-n); position: absolute; left: 0; top: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .cta-line { font-size: 12.5px; color: var(--ink70); text-align: left; margin-top: 14px; line-height: 1.8; }
  .btn-cta { background: var(--ink); color: var(--paper); }
  .sticky-cta { background: var(--ink); color: var(--paper); box-shadow: 0 18px 44px -14px rgba(22,20,15,.55); }

  /* ===== v3 (2026-10-18): 個別アドバイス・道具の組み方・事例の地図・キャラ画像 ===== */
  .char-img { width: 200px; height: 200px; margin: -6px auto 0; display: block; object-fit: contain; }
  .diag-text { font-size: 14.5px; line-height: 1.95; color: var(--ink); }
  .tool { margin: 12px 0 0; display: grid; gap: 8px; }
  .tool > div { display: grid; grid-template-columns: 5.2em 1fr; gap: 8px; align-items: baseline; }
  .tool dt { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; color: var(--ink50); }
  .tool dd { font-size: 13.5px; line-height: 1.7; color: var(--ink); min-width: 0; }
  .prompt-label { font-size: 11px; letter-spacing: .1em; color: var(--ink50); margin-top: 16px; }
  .prompt-label + .prompt-box { margin-top: 6px; }
  .pitfall { margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: rgba(216,162,92,.10); border: 1px solid rgba(216,162,92,.28); }
  .pitfall-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #9A6A2E; margin-bottom: 4px; }
  .pitfall p { font-size: 13.5px; line-height: 1.85; color: var(--ink); }
  .standpoint { font-size: 13.5px; color: var(--ink70); margin-top: 14px; line-height: 1.85; }
  .case-intro { font-size: 13px; color: var(--ink70); margin-bottom: 4px; }
  .case-area { margin-top: 16px; }
  .case-area-name { font-size: 11px; font-weight: 700; letter-spacing: .2em; color: var(--ink50); padding-bottom: 6px; border-bottom: 1px solid var(--hair); }
  .case-item { position: relative; padding: 12px 0 12px 14px; border-bottom: 1px solid var(--hair); }
  .case-item::before { content: ""; position: absolute; left: 0; top: 18px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink30); }
  .case-item.is-match::before { background: var(--vio); box-shadow: 0 0 0 4px rgba(143,125,216,.18); }
  .case-badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: #5B47AE; background: rgba(143,125,216,.14); border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }
  .case-title { font-family: var(--f-min); font-size: 16px; font-weight: 600; line-height: 1.5; }
  .case-daily { font-size: 13px; color: var(--ink70); margin-top: 2px; }
  .case-change { font-size: 12.5px; color: var(--ink); margin-top: 4px; font-weight: 600; }

  /* 36タイプ: 時間帯ピル・称号・相性 */
  .time-pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--ink70); border-radius: 999px; padding: 4px 14px; background: rgba(255,255,255,.8); border: 1px solid var(--hair); }
  .type-family { font-size: 12px; letter-spacing: .06em; color: var(--ink50); margin-top: 6px; }
  .time-line { font-size: 13px; color: var(--ink); margin-top: 14px; text-align: left; padding: 10px 14px; border-radius: 14px; }
  .t-E0 .time-line, .time-line { background: rgba(247,245,239,.9); }
  .partner { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hair); text-align: left; }
  .partner .char-img.mini, .partner .char.mini { width: 64px; height: 64px; margin: 0; flex: 0 0 64px; }
  .partner p { font-size: 12.5px; color: var(--ink70); line-height: 1.7; min-width: 0; }
  .partner p span { display: block; font-size: 10.5px; letter-spacing: .14em; color: var(--ink50); }
  .partner p b { display: block; font-family: var(--f-min); font-size: 15px; color: var(--ink); }

  .type-time { font-family: var(--f-min); font-size: 14px; letter-spacing: .2em; color: var(--ink70); margin-top: 2px; }
  .type-card .type-name { font-size: min(25px, calc((100vw - 96px) / 11.4)); white-space: nowrap; }

  .case-more { margin-top: 14px; }
  .case-more summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink70); padding: 10px 0; list-style: none; text-align: center; border: 1px solid var(--hair); border-radius: 999px; }
  .case-more summary::-webkit-details-marker { display: none; }
  .case-more[open] summary { margin-bottom: 4px; }
  .case-more summary:focus-visible { outline: 2px solid var(--vio); outline-offset: 2px; }
</style>

  parts: /*__PARTS__*/{"diagnosis":{"research":{"A":"保存した投稿を見返すたびに、使うネタを選び直しています。選ぶ基準が毎回ちがうから、同じ投稿を何度も見ることになる。基準を一度書き出せば、探す担当は別に置けます。","B":"ネタも競合も、自分の目で見ています。いいネタの条件が、まだ言葉になっていない。だから頼むとズレて、また自分で見る。条件さえ渡せば、近いものを集める担当は作れます。","C":"何を探すか説明するうちに、自分で見終わってしまう。毎回はじめて頼む形だと、説明はいつまでも短くなりません。探す条件が1枚あるだけで、次からは「いつもの」で頼めます。"},"content":{"A":"台本もキャプションも、毎回白紙から組み立てています。いつもの順番も言い回しもあるのに、どこにも書いていません。書き出した分から、下書きは手放せる。","B":"書く仕事だけは、人に渡せずに抱えています。自分らしさが何でできているのか、まだ説明できないから。書き出しや語尾のクセを先に渡せば、仕上げだけ自分で直す形にできます。","C":"説明を書くうちに、キャプションがもう1本書けてしまいます。相手が自分の書き方を知らないから、毎回そこから説明になる。一度覚えてもらえば、次からは箇条書きを貼れば話が通ります。"},"admin":{"A":"返信も外注さんへの指示も、いったん全部自分を通っています。どこまでOKかを決めるのが自分だけだから、休むと止まります。その線を書き出せば、下書きまでは任せられる。","B":"DMやお客様への返事は、いつもの感じが崩れそうで人に渡せない。その感じを作る呼び方や距離感が、まだ言葉になっていないから。よく送る返事を何通か渡せば、その調子は真似できる。","C":"返信も日程の調整も、ぜんぶ手元に残っています。小さい仕事ほど、頼む説明のほうが長くなる。返し方の型が先にあれば、下書きまでは説明なしで出てきます。"}},"firstTask":{"投稿企画":{"kurashi":"旬の野菜を1つ伝えて、作り置きのネタを3つ出してもらいます。どれを撮るかは自分で決める。","beauty":"プチプラのリップ1本でも、イエベ向けとブルベ向けで別々のネタ案が出てきます。","kosodate":"1歳半と2歳では、よくある悩みが違います。子どもの年齢を伝えると、その頃の話からネタ候補が3つ並ぶ。","kyoshitsu":"親御さんの「家だと練習しない」みたいな悩みを、1つ伝えます。それに答える形で、ネタ候補が3つ出てきます。","biz":"ネタを聞く前に、プロフィール文を貼る。発信の軸からずれにくい候補が、3つ並びます。","other":"ネタが出ない日は、先週のコメントや質問を貼っておく。次に投稿できそうな話を拾ってくれます。"},"リール台本":{"kurashi":"クローゼットを片付けた順番のメモが、30秒のビフォーアフター台本の下書きになる。","beauty":"ファンデの色選びで失敗した話。思い出した順のメモでも、30秒で話せる台本の下書きに並べ直してくれます。","kosodate":"イヤイヤ期に手こずった話は、だらだら書いたままで渡す。30秒で話せる長さに組み直してもらえます。","kyoshitsu":"入会前によく聞かれる「何歳からでも始められますか」。これに答える台本の下書きを、30秒の長さで作ってもらいます。","biz":"反応がよかったリールの台本を3本、先に覚えさせておきます。で、同じ構成のまま次のテーマの下書きが返ってくる。","other":"冒頭の一言で毎回止まるなら、先にその一言だけ5案もらえます。続きの下書きも、選んだ一言に合わせて返ってくる。"},"キャプション・CTA":{"kurashi":"材料と手順は、走り書きのメモのままでいい。見返しやすい時短レシピのキャプションに整えてくれます。","beauty":"コーデ投稿は、アイテムのサイズと身長を箇条書きで貼る。サイズ感の話まで入った下書きが返ってきます。","kosodate":"離乳食の記録が、月齢と量がひと目で分かるキャプションの下書きになります。食べなかった日の話も消さずに。","kyoshitsu":"新クラスの募集投稿は、曜日と時間帯が抜けやすい。そこを外さずに下書きしてくれます。","biz":"個別相談の案内を1本書いたら、キャプション用とLINE用に書き分けてもらえます。","other":"締めの言葉は、投稿ごとに何パターンか候補が出てきます。毎回「フォローしてね」で終わらずに済みます。"},"制作":{"kurashi":"作り置 、シートの返し方に沿った案が出る。直した文もシートに足してもらうので、使うほど自分の言い方に寄っていきます。"}},"商品説明・FAQ":{"beginner":{"tools":"ChatGPTかClaudeのチャット（今使っているほうでOK）","build":"商品の説明文と、よく聞かれる質問を3つ貼ります。答えは先に、チャットにまとめてもらう。","daily":"お客様からの質問は、答えをまとめたチャットに貼る。その答えをもとに、返信の文ができます。"},"advanced":{"tools":"Claude Code＋Gmail＋Googleスプレッドシート","build":"よくある質問と、その答えをシートにまとめておく。Claude Codeは問い合わせを読んで、シートの答えで返信を書きます。","daily":"毎朝スケジュールで動かすと、Gmailに返信の下書きが入っています。動くのはパソコンがついている間だけ。"}},"外注指示":{"beginner":{"tools":"ChatGPTかClaudeのチャット（今使っているほうでOK）","build":"外注さんに頼む作業を1つ、しゃべるみたいに書いて指示書にまとめてもらいます。","daily":"次からは同じチャットで、前回とちがうところだけ書けば大丈夫です。"},"advanced":{"tools":"Claude Code＋Googleドライブ","build":"これまでの指示書をドライブに集めて、Claude Codeに読ませます。いつもの形は、そこから覚えてくれる。","daily":"新しい案件は、やることを数行書いて渡します。締切と完成の条件まで入った指示書が、ドライブに上がってきます。"}},"事務":{"beginner":{"tools":"ChatGPTかClaudeのチャット（今使っているほうでOK）","build":"前に送った日程と請求の連絡を1通ずつ貼って、この感じでって先に見せておきます。","daily":"日程の相談が来たら、そのまま貼る。返事の案ができて、月末の請求の案内文も同じ流れで作ってもらえる。"},"advanced":{"tools":"Claude Code＋Gmail＋freee＋Discord","build":"毎朝スケジュールで動かして、Claude CodeにGmailとfreeeを見に行かせます。拾うのは、返事が要るメールと未処理の明細。","daily":"朝のDiscordに、今日返すメールと昨日の明細が並びます。freeeへの登録は、OKを出してからです。"}},"学び":{"beginner":{"tools":"ChatGPTかClaudeのチャット（今使っているほうでOK）","build":"最初に、自分の仕事をひと言で伝えておく。そのあと、記事から明日使えることを抜き出して、って頼みます。","daily":"気になった記事は、本文ごとコピーして貼る。全部読むかどうかは、返ってきたのを見てから決めます。"},"advanced":{"tools":"Claude Code＋Obsidian","build":"調べたことは、Obsidianにためていきます。ニュース集めは、スケジュールで毎朝回す。","daily":"Obsidianを開くと、AIのニュースが日付ごとに入っています。どれにも、自分の仕事でどう使えるかが1行ついてる。"}}},"pitfall":{"E0":{"research":"AIを始めようと道具から調べると、それがまた調べものになって止まります。ChatGPTかClaudeに自分のジャンルを1行書いて、今日のネタを聞く。そこからなら続けやすいです。","content":"何て頼めばいいか分からなくて、入力欄の前で固まる人が多いです。伝えたいことを箇条書きで貼って、「下書きにして」って頼むところから。","admin":"返信も予定も請求も一度に任せようとすると、準備だけで疲れて始まらない。最初は、いちばんよく来る連絡1つで足ります。"},"E1":{"research":"「ネタ出して」ってだけ頼むと、どこかで見た話ばかり返ってきます。ジャンルと、誰に届けたいかを先に書いておくと、出てくる中身が変わります。","content":"全部書いてもらうと、きれいだけど自分の言葉じゃない文になる。出てきたものは下書きと思って、普段言わない言い回しを消すのは自分の番。","admin":"出てきた返信をそのまま送ると、普段のやりとりより少し硬くなる。送るのは、一回読んで自分の言い方に直してから。"},"E2":{"research":"調べさせても一般的な話ばかりで、結局自分で選び直すことになります。どんなネタなら撮るかを先に見せてから、調べさせてます。","content":"毎回一から指示を書いていると、AIへの説明そのものが新しい仕事になっています。普段の話し方と使わない言葉を1枚にまとめて、最初に読ませると外れにくいです。","admin":"返し方の判断を言葉にしないまま任せると、丁寧だけど的外れな返事が並びます。断るときや値段を聞かれたときの線だけは、先に書いて渡してます。"},"E3":{"research":"媒体をまとめて1回で調べさせると、途中で止まるか、薄い結果で終わりがちです。媒体ごとに分けて、何のために探すかを先に書いてから任せてます。","content":"台本から投稿文まで一気に量産すると、全部同じ型と同じ温度になる。1本だけ自分で直して、その直し方を覚えさせてから次の1本に進みます。","admin":"コネクターで予定やメールまでつなぐと、送るところまで任せたくなります。送信の手前までにして、最後のボタンだけは自分で押す形。"}},"standpoint":{"own":{"research":"ネタ探しが軽くなったら、お客様の感想や質問を読み返す時間にあてられます。次の講座や商品のヒントは、たいていそこにある。","content":"キャプションを一から書かなくなると、お客様からの質問に前より丁寧に返せます。","admin":"日程や請求の連絡が片付くと、講座や商品の中身を見直す時間ができます。"},"pr":{"research":"PR案件が中心なら、浮いた時間は商品を調べるほうに回したいところ。口コミまで読んでから、企画を出せます。","content":"書く量が減ったら、案件ごとの見せ方を考える時間になります。企業さんに方向性を2つ出して、選んでもらう余裕も出ます。","admin":"細かい連絡に追われなくなった分、企業さんへの提案をじっくり考えられます。案件の返事も、待たせずに済む。"},"none":{"research":"調べものの時間を、自分の商品の準備に回せます。最初に見るのは、同じジャンルの講座や商品がどんな悩みに答えているか。","content":"毎日の投稿に追われていると、自分の商品のことはずっと後回しになる。書く時間が減った分は、まずそこに使えます。","admin":"DMでよく聞かれることは、そのまま商品のタネになります。返信の手間が減ったら、それを書き留めておけます。"}}}/*__END_PARTS__*/,

/* ============================================================
   判定ロジック（design.md §8）— 純関数・テスト対象
   hours: { 項目index: 時間 } ／ releaseKey: A|B|C ／ q7Key: D1-3 ／ aiKey: E0-3 ／ genreKey ／ productKey
   ============================================================ */
function computeResult(hours, releaseKey, q7Key, aiKey, genreKey, productKey) {
  const cats = ["research", "content", "admin"];
  const priority = ["content", "research", "admin"];
  const catHours = { research: 0, content: 0, admin: 0 };
  let weekly = 0, easeRaw = 0;
  const rows = [];
  Object.keys(hours || {}).forEach(k => {
    const i = Number(k); const h = Number(hours[k]);
    const item = DATA.checklist[i];
    if (!item || !(h > 0)) return;
    catHours[item.cat] += h; weekly += h; easeRaw += h * item.ease;
    rows.push({ i, label: item.label, hours: h, ai: item.ai, work: item.work });
  });
  rows.sort((a, b) => b.hours - a.hours || a.i - b.i);

  const maxH = Math.max(...cats.map(c => catHours[c]));
  let tied = cats.filter(c => catHours[c] === maxH);
  const rel = DATA.release.options.find(o => o.key === releaseKey);
  let type;
  if (tied.length === 1) type = tied[0];
  else if (rel && tied.includes(rel.cat)) type = rel.cat;
  else type = priority.find(c => tied.includes(c));

  const candidates = [];
  rows.forEach(r => { if (candidates.length < 2 && !candidates.includes(r.ai)) candidates.push(r.ai); });
  DATA.types[type].defaults.forEach(a => { if (candidates.length < 2 && !candidates.includes(a)) candidates.push(a); });

  const q7 = DATA.q7.options.find(o => o.key === q7Key) || DATA.q7.options[1];
  const weeklyR = Math.round(weekly * 10) / 10;
  const topItem = rows.length ? rows[0].label : null;
  const idealLine = rows.length
    ? "週" + weeklyR + "時間を「" + topItem + "」に取られてて、それが半分になれば、" + q7.phrase + "に回せる。"
    : DATA.quietWeek;

  return {
    type, weekly: weeklyR, yearly: Math.round(weekly * 50),
    easeHours: Math.round(easeRaw * 2) / 2,
    catHours, topItem, topWork: rows.length ? rows[0].work : null,
    top3: rows.slice(0, 3).map(r => ({ label: r.label, hours: r.hours })),
    candidates, idealLine,
    releaseKey: rel ? rel.key : null, q7Key: q7.key, aiKey: aiKey || null,
    level: (aiKey === "E2" || aiKey === "E3") ? "advanced" : "beginner",
    charKey: type + "_" + (rel ? rel.key : "C"),
    timeKey: DATA.times[aiKey] ? aiKey : "E1",
    genreKey: DATA.genre.options.some(o => o.key === genreKey) ? genreKey : "other",
    productKey: DATA.product.options.some(o => o.key === productKey) ? productKey : "none"
  };
}

/* 36タイプの称号: 時間帯（AI経験）×キャラ（仕事×やめられない理由） */
function typeTitle(r) {
  return DATA.times[r.timeKey].label + "の" + DATA.chars[r.charKey].nick;
}
function partnerOf(r) {
  const c = DATA.compat[r.type];
  const key = c.to + "_" + r.charKey.split("_")[1];
  return { key, nick: DATA.chars[key].nick, why: c.why };
}

/* 個別アドバイスの組み立て（design.md §9）。部品はすべて DATA.parts の固定文 */
function personalPrompt(staffKey, genreKey) {
  const g = DATA.genre.options.find(o => o.key === genreKey) || DATA.genre.options[5];
  return DATA.staff[staffKey].prompt.replace("◯◯（例:料理教室）", "◯◯（例:" + g.who + "）");
}
function buildAdvice(r) {
  const P = DATA.parts;
  const rel = r.releaseKey || "C";
  const ai = r.aiKey || "E1";
  const pick = key => ({
    key, name: DATA.staff[key].name,
    task: (P.firstTask[key] || {})[r.genreKey] || DATA.staff[key].change,
    tool: (P.toolCard[key] || {})[r.level] || null,
    prompt: personalPrompt(key, r.genreKey)
  });
  const cands = r.candidates;
  const cases = DATA.cases.map(c => Object.assign({}, c, { match: c.staff.some(s => cands.includes(s)) }));
  return {
    diagnosis: (P.diagnosis[r.type] || {})[rel] || DATA.types[r.type].desc,
    first: pick(cands[0]),
    second: pick(cands[1]),
    pitfall: (P.pitfall[ai] || {})[r.type] || "",
    standpoint: (P.standpoint[r.productKey] || {})[r.type] || "",
    cases
  };
}

/* 6軸レーダー（見える化用）: 申告時間だけで作る */
function computeAxes(hours) {
  const h = i => Number((hours || {})[i]) || 0;
  const raw = [
    h(0) + h(1),          /* ネタ探し */
    h(2) + h(3) + h(7),   /* 文章 */
    h(4),                 /* 画像・動画 */
    h(5) + h(6),          /* 返信・対応 */
    h(8) + h(9) + h(10),  /* 事務・お金 */
    h(11)                 /* 学び・情報 */
  ];
  const mx = Math.max(...raw, 1);
  return raw.map(v => Math.max(14, Math.round(v / (mx * 1.12) * 100)));
}

function easeLabel(r) { return r.easeHours < 0.5 ? "週30分" : "週" + r.easeHours + "時間"; }

/* 申込フォームの事前入力URL（design.md §10）。ボタンを押したときだけ開く */
function buildFormUrl(r) {
  const t = DATA.types[r.type];
  const rel = DATA.release.options.find(o => o.key === r.releaseKey);
  const q7 = DATA.q7.options.find(o => o.key === r.q7Key);
  const ai = DATA.aiExp.options.find(o => o.key === r.aiKey);
  const lines = ["【AI社員タイプ診断の結果】", "タイプ: " + typeTitle(r) + "（" + t.name + "・" + DATA.ha[r.charKey.split("_")[1]] + "）"];
  if (r.weekly > 0) {
    lines.push("先週の時間: 週" + r.weekly + "時間（年 約" + r.yearly + "時間）");
    lines.push("上位: " + r.top3.map(x => x.label + " " + x.hours + "h").join(" ／ "));
  } else {
    lines.push("先週の時間: チェックなし");
  }
  if (rel) lines.push("やめられない理由: " + rel.label);
  if (ai) lines.push("AI経験: " + ai.label);
  if (q7) lines.push("余白: " + q7.label);
  const g = DATA.genre.options.find(o => o.key === r.genreKey);
  const pr = DATA.product.options.find(o => o.key === r.productKey);
  if (g) lines.push("発信ジャンル: " + g.label);
  if (pr) lines.push("商品: " + pr.label);
  lines.push("最初の候補: " + r.candidates.map(k => DATA.staff[k].name).join(" ／ ") + "（" + (r.level === "advanced" ? "道具をつなぐ段" : "チャットで始める段") + "）");
  let url = DATA.form.base + "?usp=pp_url&" + DATA.form.entryNote + "=" + encodeURIComponent(lines.join("\n"));
  if (r.topWork) url += "&" + DATA.form.entryWork + "=" + encodeURIComponent(r.topWork);
  if (g) url += "&" + DATA.form.entryGenre + "=" + encodeURIComponent(g.label);
  if (pr) {
    url += "&" + DATA.form.entryProduct + "=" + encodeURIComponent(pr.form);
    if (pr.form === "__other_option__") url += "&" + DATA.form.entryProduct + ".other_option_response=" + encodeURIComponent(pr.label);
  }
  return url;
}

/* ============================================================
   画面制御
   steps: 0 start / 1 棚卸し① / 2 棚卸し②(時間) / 3 手放せなさ / 4 余白 / 5 AI経験 / 6 ジャンル / 7 商品 / 8 結果
   ============================================================ */
const TOTAL_STEPS = 8;
const state = { step: 0, checked: new Set(), hours: {}, releaseKey: null, q7Key: null, aiKey: null, genreKey: null, productKey: null };

const screenEl = document.getElementById("screen");
const progWrap = document.getElementById("progress-wrap");
const progFill = document.getElementById("progress-fill");
const progLabel = document.getElementById("progress-label");

const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>';

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function checkedHours() {
  const h = {};
  state.checked.forEach(i => { if (state.hours[i]) h[i] = state.hours[i]; });
  return h;
}

function topItemLabel() {
  const h = checkedHours();
  let best = null;
  Object.keys(h).map(Number).sort((a, b) => a - b).forEach(i => { if (best === null || h[i] > h[best]) best = i; });
  return best === null ? null : DATA.checklist[best].label;
}

function updateProgress() {
  if (state.step === 0) { progWrap.hidden = true; return; }
  progWrap.hidden = false;
  const pct = Math.min(100, Math.round(state.step / TOTAL_STEPS * 100));
  progFill.style.width = pct + "%";
  progLabel.textContent = state.step <= 7 ? "ステップ " + state.step + " / 7" : "診断結果";
}

function render() {
  updateProgress();
  if (state.step === 0) renderStart();
  else if (state.step === 1) renderChecklist();
  else if (state.step === 2) renderHours();
  else if (state.step === 3) renderRelease();
  else if (state.step === 4) renderQ7();
  else if (state.step === 5) renderAiExp();
  else if (state.step === 6) renderGenre();
  else if (state.step === 7) renderProduct();
  else renderResult();
  window.scrollTo({ top: 0 });
}

function renderStart() {
  screenEl.innerHTML =
    '<div class="screen start-glow" style="padding-top:44px">' +
      '<div class="start-ey">PERSONAL AI TEAM — DIAGNOSIS</div>' +
      '<span class="start-badge">3分・全部タップだけ</span>' +
      '<h1><span class="hg">AI社員</span>タイプ診断</h1>' +
      '<p class="start-sub">1週間の仕事をタップで棚卸し。時間がどこに消えてるかと、最初にAIに任せる仕事の候補が3分で出ます。</p>' +
      '<p class="start-note">無料・登録なしで、最後まで診断できます。</p>' +
      '<button class="btn" id="start-btn">棚卸しをはじめる</button>' +
      '<p class="byline">いチ（@ichi_ai_lab）｜AI活用で自分時間を1日+3時間</p>' +
    '</div>';
  document.getElementById("start-btn").onclick = () => { state.step = 1; render(); };
}

function optionButtons(options) {
  return options.map((o, i) =>
    '<button class="option" data-i="' + i + '">' + esc(o.label) + '</button>'
  ).join("");
}

function bindOptions(onPick, onBack) {
  screenEl.querySelectorAll(".option").forEach(btn => {
    btn.onclick = () => {
      btn.classList.add("selected");
      setTimeout(() => onPick(Number(btn.dataset.i)), 220);
    };
  });
  const back = screenEl.querySelector(".btn-back");
  if (back) back.onclick = onBack;
}

function renderChecklist() {
  const items = DATA.checklist.map((c, i) =>
    '<div class="check-item' + (state.checked.has(i) ? " checked" : "") + '" data-i="' + i + '">' +
      '<span class="check-box">' + CHECK_SVG + '</span>' +
      '<span>' + esc(c.label) + '</span>' +
    '</div>'
  ).join("");
  screenEl.innerHTML =
    '<div class="screen">' +
      '<div class="q-number">棚卸し 1</div>' +
      '<div class="q-text">先週やった仕事、当てはまるもの全部にチェック</div>' +
      '<p class="check-intro">時間の合計は次の画面で出します。当てはまるものが無ければ、そのまま次へ。</p>' +
      items +
      '<div id="live-total"><span class="lt-label">いまのチェック</span><span class="lt-value" id="lt-value">0 個</span></div>' +
      '<button class="btn" id="to-next">次へ</button>' +
    '</div>';

  function refreshTotal() {
    document.getElementById("lt-value").textContent = state.checked.size + " 個";
  }
  refreshTotal();
  screenEl.querySelectorAll(".check-item").forEach(el => {
    el.onclick = () => {
      const i = Number(el.dataset.i);
      if (state.checked.has(i)) { state.checked.delete(i); delete state.hours[i]; el.classList.remove("checked"); }
      else { state.checked.add(i); el.classList.add("checked"); }
      refreshTotal();
    };
  });
  document.getElementById("to-next").onclick = () => {
    state.step = state.checked.size > 0 ? 2 : 3;
    render();
  };
}

function renderHours() {
  const idx = [...state.checked].sort((a, b) => a - b);
  const rows = idx.map(i =>
    '<div class="hours-row" data-i="' + i + '">' +
      '<div class="hours-label">' + esc(DATA.checklist[i].label) + '</div>' +
      '<div class="seg">' + DATA.hoursOptions.map((o, k) =>
        '<button data-k="' + k + '"' + (state.hours[i] === o.h ? ' class="on"' : '') + '>' + esc(o.label) + '</button>'
      ).join("") + '</div>' +
    '</div>'
  ).join("");
  screenEl.innerHTML =
    '<div class="screen">' +
      '<div class="q-number">棚卸し 2</div>' +
      '<div class="q-text">先週、それぞれどのくらいでしたか</div>' +
      '<p class="check-intro">ざっくりで大丈夫です。合計はこの場で出します。</p>' +
      rows +
      '<div id="live-total"><span class="lt-label" id="lt-label">あと 0 つ</span><span class="lt-value" id="lt-value">週 0時間</span></div>' +
      '<button class="btn" id="to-next" disabled>次へ</button>' +
      '<button class="btn-back">ひとつ前に戻る</button>' +
    '</div>';

  function refresh() {
    let t = 0, left = 0;
    idx.forEach(i => { if (state.hours[i]) t += state.hours[i]; else left += 1; });
    document.getElementById("lt-value").textContent = "週 " + (Math.round(t * 10) / 10) + "時間";
    document.getElementById("lt-label").textContent = left > 0 ? "あと " + left + " つ" : "全部えらべました";
    document.getElementById("to-next").disabled = left > 0;
  }
  refresh();
  screenEl.querySelectorAll(".hours-row").forEach(row => {
    const i = Number(row.dataset.i);
    row.querySelectorAll("button").forEach(b => {
      b.onclick = () => {
        state.hours[i] = DATA.hoursOptions[Number(b.dataset.k)].h;
        row.querySelectorAll("button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        refresh();
      };
    });
  });
  document.getElementById("to-next").onclick = () => { state.step = 3; render(); };
  screenEl.querySelector(".btn-back").onclick = () => { state.step = 1; render(); };
}

function radarSVG(vals) {
  const cx = 165, cy = 128, r = 86, n = 6;
  const LBL = ["ネタ探し", "文章", "画像・動画", "返信・対応", "事務・お金", "学び・情報"];
  const pt = (i, rr) => {
    const a = -Math.PI / 2 + i * Math.PI * 2 / n;
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  };
  let grid = "";
  [0.33, 0.66, 1].forEach(k => {
    const ps = Array.from({ length: n }, (_, i) => pt(i, r * k).map(v => v.toFixed(1)).join(",")).join(" ");
    grid += '<polygon points="' + ps + '" fill="none" stroke="rgba(22,20,15,.1)" stroke-width="1"/>';
  });
  let axes = "";
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, r);
    axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="rgba(22,20,15,.08)"/>';
  }
  const poly = vals.map((v, i) => pt(i, r * v / 100).map(x => x.toFixed(1)).join(",")).join(" ");
  let dots = "", labels = "";
  const LC = ["#B95F84", "#6C55BE", "#8F7DD8", "#3E8266", "#4E9E7E", "#C08A3E"];
  vals.forEach((v, i) => {
    const [x, y] = pt(i, r * v / 100);
    dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.2" fill="' + LC[i] + '"/>';
    const [lx, ly] = pt(i, r + 20);
    labels += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="middle" font-size="11" fill="rgba(22,20,15,.62)" font-weight="600">' + LBL[i] + '</text>';
  });
  return '<svg viewBox="0 0 330 262">'
    + '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#D4849F"/><stop offset=".5" stop-color="#8F7DD8"/><stop offset="1" stop-color="#4E9E7E"/>'
    + '</linearGradient></defs>'
    + grid + axes
    + '<polygon points="' + poly + '" fill="url(#rg)" fill-opacity=".3" stroke="url(#rg)" stroke-width="2.2" stroke-linejoin="round"/>'
    + dots + labels + '</svg>';
}

  }).join("");
  const shown = adv.cases.filter(c => c.match);
  adv.cases.filter(c => !c.match).forEach(c => { if (shown.length < 4) shown.push(c); });
  const rest = adv.cases.filter(c => !shown.includes(c));
  const caseMap = !adv.cases.length ? '' :
    '<div class="section-card case-map">' +
      '<div class="sc-label">いチの現場で、AIに任せている仕事</div>' +
      '<p class="case-intro">毎日実際に動いているものだけ載せています。印があるのは、あなたの候補に近いもの。</p>' +
      caseGroup(shown) +
      (rest.length ? '<details class="case-more"><summary>ほかの仕事も見る（' + rest.length + '件）</summary>' + caseGroup(rest) + '</details>' : '') +
    '</div>';

  screenEl.innerHTML =
    '<div class="screen result-pad">' +
      '<p class="result-eyebrow">YOUR RESULT — あなたの診断結果</p>' +
      '<div class="stat-card">' +
        '<div class="nc-title">あなたの時間の使いかたマップ</div>' +
        '<div class="radar-wrap">' + radarSVG(axes) + '</div>' +
        numBlock +
      '</div>' +
      '<div class="type-card">' +
        '<div class="time-pill t-' + r.timeKey + '">36タイプのうち</div>' +
        charHTML(r.charKey) +
        '<div class="type-time">' + esc(DATA.times[r.timeKey].label) + 'の</div>' +
        '<div class="type-name">' + esc(DATA.chars[r.charKey].nick) + '</div>' +
        '<div class="type-family">' + esc(t.name) + '　×　' + esc(DATA.ha[r.charKey.split("_")[1]]) + '</div>' +
        '<p class="time-line">' + esc(DATA.times[r.timeKey].label) + '｜' + esc(DATA.times[r.timeKey].line) + '</p>' +
        '<p class="type-desc">' + esc(t.desc) + '</p>' +
        '<div class="partner">' + charHTML(partnerOf(r).key).replace('class="char-img"', 'class="char-img mini"').replace('class="char"', 'class="char mini"') +
          '<p><span>相性がいいのは</span><b>' + esc(partnerOf(r).nick) + '</b>' + esc(partnerOf(r).why) + '</p></div>' +
        '<button class="share-btn" id="share-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><line x1="12" y1="2" x2="12" y2="15"/></svg>この結果をシェアする</button>' +
      '</div>' +
      '<div class="section-card diag-card">' +
        '<div class="sc-label">あなたの場合</div>' +
        '<p class="diag-text">' + esc(adv.diagnosis) + '</p>' +
      '</div>' +
      '<div class="yohaku">' + esc(r.idealLine) + '</div>' +
      '<div class="section-card">' +
        '<div class="sc-label">最初に任せる担当</div>' +
        cands +
        (adv.pitfall ? '<div class="pitfall"><div class="pitfall-label">最初につまずきやすいところ</div><p>' + esc(adv.pitfall) + '</p></div>' : '') +
        (adv.standpoint ? '<p class="standpoint">' + esc(adv.standpoint) + '</p>' : '') +
        '<p class="cand-close">' + esc(DATA.candClose) + '</p>' +
      '</div>' +
      caseMap +
      '<div class="cta-card">' +
        '<div class="cta-title">' + esc(DATA.cta.title) + '</div>' +
        '<p class="cta-body">' + esc(DATA.cta.body) + '</p>' +
        '<div class="promise-title">' + esc(DATA.cta.promiseTitle) + '</div>' +
        '<ul class="promise">' + DATA.cta.promise.map((p, n) => '<li data-n="' + (n + 1) + '">' + esc(p) + '</li>').join("") + '</ul>' +
        '<p class="cta-line">' + esc(DATA.cta.line) + '</p>' +
        '<a class="btn btn-cta" id="cta-btn" href="' + esc(formUrl) + '" target="_blank" rel="noopener">' + esc(DATA.cta.button) + '</a>' +
        '<p class="cta-note">' + esc(DATA.cta.note) + '</p>' +
      '</div>' +
      '<div class="retry"><button id="retry-btn">もう一度診断する</button></div>' +
      '<p class="privacy">' + esc(DATA.privacy) + '</p>' +
      '<a class="sticky-cta" id="sticky-btn" href="' + esc(formUrl) + '" target="_blank" rel="noopener">' + esc(DATA.cta.sticky) + '</a>' +
    '</div>';

  document.getElementById("share-btn").onclick = function () {
    const text = '私のAI社員タイプは、36タイプのうち「' + typeTitle(r) + '」でした。' +
      (r.weekly > 0 ? '先週は週' + r.weekly + '時間が、発信と裏方の仕事に使われていました。' : '') +
      '\n自分の時間がどこに消えているか3分でわかる無料診断はこちら';
    const url = location.href;
    if (navigator.share) {
      navigator.share({ title: "AI社員タイプ診断", text: text, url: url }).catch(() => {});
    } else {
      const done = () => { this.textContent = "コピーしました。SNSに貼ってシェアできます"; };
      if (navigator.clipboard) navigator.clipboard.writeText(text + "\n" + url).then(done.bind(this));
    }
  };
  const copyBtn = document.getElementById("copy-btn");
  if (copyBtn) copyBtn.onclick = function () {
    const txt = adv.first.prompt;
    const done = () => { this.textContent = "コピーしました"; setTimeout(() => { this.textContent = "この文をコピーする"; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done.bind(this));
    } else {
      const ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      done.call(this);
    }
  };
  document.getElementById("retry-btn").onclick = () => {
    state.step = 0; state.checked = new Set(); state.hours = {}; state.releaseKey = null; state.q7Key = null; state.aiKey = null; state.genreKey = null; state.productKey = null;
    render();
  };
}

render();

/* node からのロジックテスト用 */
if (typeof module !== "undefined") { module.exports = { computeResult, computeAxes, buildFormUrl, easeLabel, buildAdvice, personalPrompt, typeTitle, partnerOf, DATA }; }
</script>
</body>
</html>
